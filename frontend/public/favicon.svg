<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#137a4d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shield Base Background -->
  <path d="M50 5 L85 18 C85 60, 50 88, 50 95 C50 88, 15 60, 15 18 Z" 
        fill="url(#shieldGrad)" 
        stroke="#34d399" 
        stroke-width="3" 
        filter="url(#dropShadow)"/>
  
  <!-- Cadastral Contour Lines / Growth Emblem -->
  <path d="M50 22 C68 22, 74 38, 74 52 C74 72, 50 84, 50 84 C50 84, 26 72, 26 52 C26 38, 32 22, 50 22 Z" 
        fill="none" 
        stroke="#6ee7b7" 
        stroke-width="2" 
        stroke-dasharray="3 2" 
        opacity="0.7"/>

  <!-- Center Land & Seedling Tree Motif -->
  <circle cx="50" cy="45" r="14" fill="url(#innerGrad)"/>
  
  <!-- Tree / Sprout Icon -->
  <path d="M50 35 C46 35, 43 38, 43 42 C43 46, 46 48, 50 53 C54 48, 57 46, 57 42 C57 38, 54 35, 50 35 Z" fill="#ffffff"/>
  <path d="M50 48 L50 62 M45 55 L50 51 M55 55 L50 51" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
